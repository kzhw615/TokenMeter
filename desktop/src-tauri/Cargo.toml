[package]
name = "tokenmeter-desktop"
version = "0.1.0"
description = "TokenMeter 跨平台托盘应用（Tauri shell + tokenmeter sidecar）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
