name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test
